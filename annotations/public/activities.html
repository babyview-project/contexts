<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity Annotations</title>
    <link rel="stylesheet" href="activities.css">
</head>
<body>
    <header class="topbar">
        <div class="topbar-left">
            <strong>Activity Annotations</strong>
            <span id="task-badge" class="badge" hidden></span>
            <span id="annotator-badge" class="badge badge-muted" hidden></span>
            <button type="button" id="logout-btn" class="btn btn-small" hidden>Log out</button>
            <span id="mode-badge" class="badge badge-warn" hidden></span>
        </div>
        <div id="step" class="step"></div>
        <div class="topbar-right">
            <nav id="dev-nav" class="dev-nav" hidden>
                <span>Skip to:</span>
                <button type="button" data-jump="examples">Examples</button>
                <button type="button" data-jump="practice">Practice</button>
                <button type="button" data-jump="main">Main videos</button>
                <a href="admin.html" target="_blank">Admin</a>
            </nav>
            <button type="button" id="info-btn" class="info-btn" aria-haspopup="dialog">ⓘ Definitions</button>
        </div>
    </header>

    <main id="app">
        <div class="card center"><p>Loading…</p></div>
    </main>

    <div id="definitions-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="definitions-title" hidden>
        <div class="modal-backdrop" data-close></div>
        <div class="modal-panel">
            <div class="modal-header">
                <h2 id="definitions-title">Activity definitions</h2>
                <button type="button" class="icon-btn" data-close aria-label="Close">✕</button>
            </div>
            <div class="tabs" role="tablist">
                <button type="button" role="tab" data-tab="do">Doing</button>
                <button type="button" role="tab" data-tab="see">Seeing</button>
            </div>
            <div id="definitions-body" class="modal-body"></div>
        </div>
    </div>

    <div id="login-modal" class="modal" role="dialog" aria-modal="true" hidden>
        <div class="modal-backdrop"></div>
        <form id="login-form" class="modal-panel modal-small">
            <h2>Log in</h2>
            <p id="login-message" class="muted"></p>
            <label>Username <input name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
            <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
            <p id="login-error" class="error" hidden>Login failed. Please try again.</p>
            <button type="submit" class="btn btn-primary">Log in</button>
        </form>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="activities.js"></script>
</body>
</html>
